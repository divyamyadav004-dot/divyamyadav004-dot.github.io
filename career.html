        'Careerix</a>' +
        '<nav class="nav" aria-label="Main">' +
        '<a href="careers.html"' + (page === "careers" ? ' aria-current="page"' : "") + '>Careers</a>' +
        '<a href="quiz.html"' + (page === "quiz" ? ' aria-current="page"' : "") + '>Quiz</a>' +
        '<a href="about.html"' + (page === "about" ? ' aria-current="page"' : "") + '>About</a>' +
        '<button class="class-pill" id="classPill" type="button" aria-haspopup="dialog">Choose class ▾</button>' +
        '</nav></div>';
    }

    var footer = document.getElementById("site-footer");
    if (footer) {
      footer.className = "site-footer";
      footer.innerHTML =
        '<div class="wrap">' +
        '<p><strong>Careerix</strong> is a free guide for students. Information is approximate and can change. ' +
        'Always confirm dates, fees and eligibility on the official website of the exam or college before you decide or pay anything.</p>' +
        '<p>We never promise jobs, ranks or income. <a href="about.html">Read how we keep this safe</a> · <a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms of Use</a>.</p>' +
        '</div>';
    }

    var dlg = document.createElement("dialog");
    dlg.id = "classDialog";
    dlg.setAttribute("aria-labelledby", "dlgTitle");
    var opts = CLASSES.map(function (c) {
      return '<button type="button" data-k="' + c.k + '" aria-pressed="false">' + c.label + "</button>";
    }).join("");
    dlg.innerHTML =
      '<h2 id="dlgTitle">Which class are you in?</h2>' +
      '<p class="muted">We will show only the steps that are still ahead of you.</p>' +
      '<div class="dlg-opts">' + opts + "</div>" +
      '<button class="btn btn-ghost" type="button" id="dlgClose">Close</button>';
    document.body.appendChild(dlg);

    dlg.querySelectorAll(".dlg-opts button").forEach(function (b) {
      b.addEventListener("click", function () {
        setClass(b.dataset.k);
        if (dlg.close) dlg.close(); else dlg.removeAttribute("open");
      });
    });
    document.getElementById("dlgClose").addEventListener("click", function () {
      if (dlg.close) dlg.close(); else dlg.removeAttribute("open");
    });
    var pill = document.getElementById("classPill");
    if (pill) pill.addEventListener("click", openClassDialog);
    updatePill();
  }

  window.Careerix = {
    CLASSES: CLASSES,
    STAGE_ORDER: STAGE_ORDER,
    getClass: getClass,
    setClass: setClass,
    classLabel: classLabel,
    openClassDialog: openClassDialog,
    esc: esc,
    byId: function (id) {
      var list = window.CAREERS || [];
      for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
      return null;
    }
  };

  document.addEventListener("DOMContentLoaded", buildChrome);
})();

</script>
  <script>
/* Career detail page */
(function () {
  var C = window.Careerix;
  var e = C.esc;

  var STAGE_LABEL = {
    "9": "Class 9",
    "10": "Class 10",
    "11": "Class 11",
    "12": "Class 12",
    "college": "College years",
    "work": "After college"
  };

  function stageIdx(s) { return C.STAGE_ORDER.indexOf(s); }

  function stepHtml(st, here) {
    return (
      '<li class="rstep' + (here ? " here" : "") + '">' +
      '<span class="pin" aria-hidden="true"></span>' +
      '<div class="when">' + e(STAGE_LABEL[st.s] || st.s) + (here ? '<span class="here-tag">You are here</span>' : "") + "</div>" +
      "<h3>" + e(st.t) + "</h3>" +
      "<p>" + e(st.d) + "</p></li>"
    );
  }

  function roadmapHtml(c) {
    var k = C.getClass();
    var idx = k ? stageIdx(k) : -1;
    var earlier = [], ahead = [];
    c.roadmap.forEach(function (st) {
      if (idx >= 0 && stageIdx(st.s) < idx) earlier.push(st); else ahead.push(st);
    });
    var html = "";
    if (earlier.length) {
      html +=
        '<details class="earlier"><summary>Steps you have already passed (' + earlier.length + ")</summary>" +
        '<ol class="roadmap">' + earlier.map(function (s) { return stepHtml(s, false); }).join("") + "</ol></details>";
    }
    html += '<ol class="roadmap">' +
      ahead.map(function (s, i) { return stepHtml(s, idx >= 0 && i === 0); }).join("") + "</ol>";
    return html;
  }

  function banner(c) {
    var k = C.getClass();
    if (k) {
      return '<div class="class-banner"><span>Showing your roadmap from ' + e(C.classLabel(k)) + ' onward.</span>' +
        '<button type="button" id="changeClass">Change class</button></div>';
    }
    return '<div class="class-banner"><span>Choose your class to hide steps you have already passed.</span>' +
      '<button type="button" id="changeClass">Choose class</button></div>';
  }

  function table(headers, rows) {
    return '<div class="table-scroll"><table class="simple"><thead><tr>' +
      headers.map(function (h) { return "<th>" + e(h) + "</th>"; }).join("") +
      "</tr></thead><tbody>" +
      rows.map(function (r) { return "<tr>" + r.map(function (x) { return "<td>" + e(x) + "</td>"; }).join("") + "</tr>"; }).join("") +
      "</tbody></table></div>";
  }

  function tagList(list) {
    return '<ul class="tags">' + list.map(function (x) { return "<li>" + e(x) + "</li>"; }).join("") + "</ul>";
  }

  function prosConsHtml(c) {
    if (!c.pros || !c.cons) return "";
    return '<section class="block"><h2>Good parts and hard parts</h2><div class="two-col">' +
      '<div class="panel"><h3>What people enjoy</h3><ul>' + c.pros.map(function (p) { return "<li>" + e(p) + "</li>"; }).join("") + "</ul></div>" +
      '<div class="panel"><h3>What is genuinely hard</h3><ul>' + c.cons.map(function (p) { return "<li>" + e(p) + "</li>"; }).join("") + "</ul></div>" +
      "</div></section>";
  }

  function dayHtml(c) {
    if (!c.day) return "";
    return '<section class="block"><h2>A day in this career</h2><div class="panel"><p>' + e(c.day) + "</p></div></section>";
  }

  function collegesHtml(c) {
    if (!c.colleges || !c.colleges.length) return "";
    return '<section class="block"><h2>Colleges to look at</h2>' +
      '<p class="muted">Examples only, not a ranking. Check each college\u2019s official site for admission rules.</p>' +
      table(["College", "How admission usually works"], c.colleges.map(function (x) { return [x.n, x.note]; })) +
      "</section>";
  }

  function planHtml(c) {
    if (!c.plan) return "";
    var order = ["9", "10", "11", "12", "college"];
    var items = order.filter(function (k) { return c.plan[k]; }).map(function (k) {
      return '<div class="panel"><h3>' + e(STAGE_LABEL[k] || k) + "</h3><ul>" +
        c.plan[k].map(function (t) { return "<li>" + e(t) + "</li>"; }).join("") + "</ul></div>";
    }).join("");
    return '<section class="block"><h2>What to do, class by class</h2><div class="two-col">' + items + "</div></section>";
  }

  function mythsHtml(c) {
    if (!c.myths || !c.myths.length) return "";
    return '<section class="block"><h2>Myth vs fact</h2>' +
      c.myths.map(function (m) {
        return '<div class="panel" style="margin-bottom:10px"><p style="margin-bottom:6px"><strong>Myth:</strong> ' + e(m.m) + "</p>" +
          '<p style="margin-bottom:0"><strong>Fact:</strong> ' + e(m.f) + "</p></div>";
      }).join("") + "</section>";
  }

  function backupHtml(c) {
    if (!c.backup || !c.backup.length) return "";
    return '<section class="block"><h2>Backup options</h2><p class="muted">Good to know in case your first plan does not work out.</p>' +
      tagList(c.backup) + "</section>";
  }

  function checklistHtml(c) {
    return '<div class="progress" aria-hidden="true"><div id="bar"></div></div><p class="muted" id="progressText"></p>' +
      c.checklist.map(function (t, i) {
        return '<label class="check"><input type="checkbox" data-i="' + i + '"><span>' + e(t) + "</span></label>";
      }).join("");
  }

  function loadChecks(id) {
    try { return JSON.parse(localStorage.getItem("careerix.check." + id) || "[]"); } catch (x) { return []; }
  }
  function saveChecks(id, arr) {
    try { localStorage.setItem("careerix.check." + id, JSON.stringify(arr)); } catch (x) {}
  }

  function wireChecklist(c) {
    var saved = loadChecks(c.id);
    var boxes = document.querySelectorAll(".check input");
    function refresh() {
      var done = 0;
      boxes.forEach(function (b) {
        if (b.checked) done++;
        b.parentElement.classList.toggle("done", b.checked);
      });
      document.getElementById("bar").style.width = Math.round((done / boxes.length) * 100) + "%";
      document.getElementById("progressText").textContent = done + " of " + boxes.length + " done";
    }
    boxes.forEach(function (b) {
      b.checked = saved.indexOf(Number(b.dataset.i)) !== -1;
      b.addEventListener("change", function () {
        var arr = [];
        boxes.forEach(function (x) { if (x.checked) arr.push(Number(x.dataset.i)); });
        saveChecks(c.id, arr);
        refresh();
      });
    });
    refresh();
  }

  function render() {
    var params = new URLSearchParams(location.search);
    var c = C.byId(params.get("id"));
    var root = document.getElementById("career");
    if (!c) {
      root.innerHTML = '<div class="wrap section"><h1>Career not found</h1><p>Go back to <a href="careers.html">all careers</a> and choose one.</p></div>';
      return;
    }
    document.title = c.name + " roadmap | Careerix";

    var status = c.verified
      ? '<span class="badge">Checked ' + e(c.updated) + "</span>"
      : '<span class="badge warn">Being checked</span>';

    var warn = c.verified ? "" :
      '<div class="note"><p><strong>This page is still being checked.</strong> Exam names and steps are a good starting point, but fees, dates, ages and eligibility can change. Confirm everything on the official websites listed at the bottom before you decide.</p></div>';

    root.innerHTML =
      '<div class="career-head"><div class="wrap">' +
      '<div class="crumbs"><a href="careers.html">All careers</a></div>' +
      status +
      "<h1>" + e(c.name) + "</h1>" +
      '<p class="muted">' + e(c.tagline) + "</p>" +
      "<p>" + e(c.overview) + "</p>" +
      banner(c) +
      "</div></div>" +

      '<div class="wrap">' + warn +

      '<section class="block"><h2>Your roadmap</h2>' + roadmapHtml(c) + "</section>" +

      planHtml(c) +
      dayHtml(c) +
      prosConsHtml(c) +

      '<section class="block"><h2>Subjects and skills</h2>' +
      '<p class="muted">' + e(c.streamNote) + "</p>" +
      '<div class="two-col">' +
      '<div class="panel"><h3>Subjects</h3>' + tagList(c.subjects) + "</div>" +
      '<div class="panel"><h3>Skills that help</h3>' + tagList(c.skills) + "</div>" +
      "</div></section>" +

      '<section class="block"><h2>Entrance exams</h2>' +
      table(["Exam", "Conducted by", "What it is for"], c.exams.map(function (x) { return [x.name, x.body, x.note]; })) +
      "</section>" +

      '<section class="block"><h2>Courses and duration</h2>' +
      table(["Course", "Duration"], c.courses.map(function (x) { return [x.name, x.duration]; })) +
      "</section>" +

      collegesHtml(c) +

      '<section class="block"><h2>Approximate cost</h2>' +
      '<div class="two-col">' +
      '<div class="panel"><h3>Government route</h3><p>' + e(c.cost.govt) + "</p></div>" +
      '<div class="panel"><h3>Private route</h3><p>' + e(c.cost.private) + "</p></div>" +
      "</div>" +
      '<div class="note"><p>' + e(c.cost.note) + "</p></div></section>" +

      '<section class="block"><h2>Jobs and pay</h2>' +
      table(["Role", "Pay idea"], c.roles.map(function (x) { return [x.title, x.pay]; })) +
      '<div class="note alert"><p>' + e(c.salaryNote) + "</p></div></section>" +

      mythsHtml(c) +
      backupHtml(c) +

      '<section class="block"><h2>Common questions</h2>' +
      c.faqs.map(function (f) { return '<details class="faq"><summary>' + e(f.q) + "</summary><p>" + e(f.a) + "</p></details>"; }).join("") +
      "</section>" +

      '<section class="block"><h2>Your preparation checklist</h2>' + checklistHtml(c) + "</section>" +

      '<section class="block"><h2>Official sources</h2>' +
      '<p class="muted">Confirm dates, fees and eligibility here before you decide.</p>' +
      "<ul>" + c.sources.map(function (s) {
        return '<li><a href="' + e(s.url) + '" target="_blank" rel="noopener noreferrer">' + e(s.label) + "</a></li>";
      }).join("") + "</ul></section>" +
      "</div>";

    wireChecklist(c);
    var btn = document.getElementById("changeClass");
    if (btn) btn.addEventListener("click", C.openClassDialog);
  }

  document.addEventListener("DOMContentLoaded", render);
  document.addEventListener("classchange", render);
})();

</script>
</body>
</html>
